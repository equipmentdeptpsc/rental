name: Approved UAT Postgres Migration Apply

on:
  push:
    branches:
      - codex/uat-postgres-remote-diagnostic
    paths:
      - .github/workflows/uat-postgres-apply-approved.yml

permissions:
  contents: read

jobs:
  apply-approved-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: approved-uat-postgres-migration-20261008000100
      cancel-in-progress: false
    env:
      UAT_PROJECT_REF: jtkctarqbwmqdcewthkn
      UAT_POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com
    steps:
      - name: Check out authorized integration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ef6feb1ac1c1215034de4e33a79c8edff0f92f6b
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.110.0

      - name: Verify, dry-run, apply, and verify UAT migration
        shell: bash
        env:
          UAT_SUPABASE_DB_PASSWORD: ${{ secrets.UAT_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          expected_sha=ef6feb1ac1c1215034de4e33a79c8edff0f92f6b
          expected_migration_sha=3DA8E286748DD06D56762ED99AB15552FA670B5B73A1EC2BC9C39C272DFF069A
          migration=supabase/migrations/20261008000100_uat_management_approval_guards.sql

          [[ "$UAT_PROJECT_REF" == jtkctarqbwmqdcewthkn ]] || { echo 'PROJECT_REF=FAIL'; exit 1; }
          [[ "$UAT_POOLER_HOST" == aws-0-ap-southeast-1.pooler.supabase.com ]] || { echo 'POOLER_HOST=FAIL'; exit 1; }
          [[ -n "$UAT_SUPABASE_DB_PASSWORD" ]] || { echo 'UAT_SECRET=ABSENT'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$expected_sha" ]] || { echo 'PINNED_SHA=FAIL'; exit 1; }
          echo 'PINNED_SHA=PASS'
          [[ -f "$migration" ]] || { echo 'MIGRATION_FILE=ABSENT'; exit 1; }
          echo 'MIGRATION_FILE=PRESENT'
          [[ "$(sha256sum "$migration" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')" == "$expected_migration_sha" ]] || { echo 'MIGRATION_SHA=FAIL'; exit 1; }
          echo 'MIGRATION_SHA=PASS'
          if compgen -G 'supabase/migrations/20261003000630*' >/dev/null; then
            echo 'EXCLUDED_MIGRATION=PRESENT'
            exit 1
          fi
          echo 'EXCLUDED_MIGRATION=ABSENT'
          [[ "$(supabase --version)" == 2.110.0 ]] || { echo 'SUPABASE_CLI=FAIL'; exit 1; }

          export PGHOST="$UAT_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.$UAT_PROJECT_REF"
          export PGDATABASE=postgres
          export PGPASSWORD="$UAT_SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=10

          pg_error="$(mktemp)"
          dry_run_output="$(mktemp)"
          apply_output="$(mktemp)"
          trap 'rm -f "$pg_error" "$dry_run_output" "$apply_output"' EXIT

          if ! one="$(timeout 20s psql -X -A -t -q -v ON_ERROR_STOP=1 -c 'SELECT 1;' 2>"$pg_error")"; then
            echo 'POSTGRES_SSL_NATIVE=FAILED'
            exit 1
          fi
          echo 'POSTGRES_SSL_NATIVE=CONNECTED'
          [[ "$one" == 1 ]] || { echo 'SELECT_1=FAIL'; exit 1; }
          echo 'SELECT_1=PASS'

          check_ledger() {
            local phase="$1" remote_versions
            : >"$pg_error"
            if ! remote_versions="$(timeout 20s psql -X -A -t -q -v ON_ERROR_STOP=1 -c 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;' 2>"$pg_error")"; then
              echo "${phase}_LEDGER=QUERY_FAILED"
              return 1
            fi
            REMOTE_VERSIONS="$remote_versions" LEDGER_PHASE="$phase" python3 - <<'PY'
          import os, pathlib, re, sys
          remote = [v for v in os.environ['REMOTE_VERSIONS'].splitlines() if v]
          local = [p.name.split('_', 1)[0] for p in pathlib.Path('supabase/migrations').glob('*.sql')]
          phase = os.environ['LEDGER_PHASE']
          if not all(re.fullmatch(r'\d{14}', v) for v in remote + local):
              print(f'{phase}_LEDGER=INVALID_VERSION')
              sys.exit(1)
          if len(remote) != len(set(remote)) or len(local) != len(set(local)):
              print(f'{phase}_LEDGER=DUPLICATE_VERSION')
              sys.exit(1)
          remote_set, local_set = set(remote), set(local)
          pending = sorted(local_set - remote_set)
          remote_only = sorted(remote_set - local_set)
          unexpected = sorted(set(pending) - {'20261008000100'})
          latest = max(remote) if remote else 'NONE'
          print(f'{phase}_LATEST_REMOTE={latest}')
          print(f'{phase}_LOCAL_PENDING={",".join(pending) if pending else "NONE"}')
          print(f'{phase}_REMOTE_ONLY={",".join(remote_only) if remote_only else "NONE"}')
          print(f'{phase}_UNEXPECTED_PENDING={",".join(unexpected) if unexpected else "NONE"}')
          if phase == 'PRE':
              valid = latest == '20261007000100' and pending == ['20261008000100'] and not remote_only and not unexpected
          else:
              valid = latest == '20261008000100' and not pending and not remote_only and not unexpected and '20261008000100' in remote_set
          print(f'{phase}_LEDGER=' + ('PASS' if valid else 'FAIL'))
          sys.exit(0 if valid else 1)
          PY
          }

          check_ledger PRE

          DB_URL="$(python3 - <<'PY'
          import os, urllib.parse
          password = urllib.parse.quote(os.environ['UAT_SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{os.environ['UAT_PROJECT_REF']}:{password}@{os.environ['UAT_POOLER_HOST']}:5432/postgres?sslmode=require")
          PY
          )"
          echo "::add-mask::$DB_URL"

          if ! timeout 120s supabase db push --db-url "$DB_URL" --dry-run >"$dry_run_output" 2>&1; then
            echo 'DRY_RUN=CLI_ERROR'
            exit 1
          fi
          DRY_RUN_OUTPUT="$dry_run_output" python3 - <<'PY'
          import os, pathlib, re, sys
          output = pathlib.Path(os.environ['DRY_RUN_OUTPUT']).read_text(errors='replace')
          output = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', output)
          proposed = sorted(set(re.findall(r'\b\d{14}_[A-Za-z0-9_.-]+\.sql\b', output)))
          finished = bool(re.search(r'Finished supabase db push', output, re.I))
          print('DRY_RUN_PROPOSED=' + (','.join(proposed) if proposed else 'NONE'))
          valid = finished and proposed == ['20261008000100_uat_management_approval_guards.sql']
          print('DRY_RUN=' + ('PASS' if valid else 'FAIL'))
          sys.exit(0 if valid else 1)
          PY

          # This is the sole database mutation in this workflow.
          if ! timeout 180s supabase db push --db-url "$DB_URL" --yes >"$apply_output" 2>&1; then
            echo 'APPLY=CLI_ERROR'
            exit 1
          fi
          echo 'APPLY=CLI_SUCCESS'

          if ! one="$(timeout 20s psql -X -A -t -q -v ON_ERROR_STOP=1 -c 'SELECT 1;' 2>"$pg_error")"; then
            echo 'POST_APPLY_SELECT_1=QUERY_FAILED'
            exit 1
          fi
          [[ "$one" == 1 ]] || { echo 'POST_APPLY_SELECT_1=FAIL'; exit 1; }
          echo 'POST_APPLY_SELECT_1=PASS'
          check_ledger POST

          echo 'EXPECTED_PENDING_ONLY=PASS'
          object_checks="$(timeout 20s psql -X -A -t -q -v ON_ERROR_STOP=1 <<'SQL'
          WITH checks(name, ok) AS (
            VALUES
              ('RENTAL_RELEASE_GUARD_PRESENT',
                to_regprocedure('erp.require_management_approval_for_rental_release()') IS NOT NULL AND
                EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='require_parent_rental_release_approval' AND tgrelid='erp.rentals'::regclass AND NOT tgisinternal)),
              ('LINE_RELEASE_GUARD_PRESENT',
                EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='require_line_rental_release_approval' AND tgrelid='erp.rental_equipment_lines'::regclass AND NOT tgisinternal)),
              ('BILLING_APPROVAL_AUTH_PRESENT',
                to_regprocedure('erp.require_scoped_billing_approval()') IS NOT NULL AND
                EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='require_scoped_billing_approval' AND tgrelid='erp.billing_statements'::regclass AND NOT tgisinternal) AND
                (SELECT count(*)=2 FROM erp.role_permissions rp JOIN erp.app_roles r ON r.id=rp.role_id JOIN erp.app_permissions p ON p.id=rp.permission_id WHERE r.code='operations-manager' AND p.code IN ('billing.approve','dashboard.financial.read'))),
              ('CUSTOMER_SEND_GUARD_PRESENT',
                to_regprocedure('erp.require_management_approval_for_billing_email()') IS NOT NULL AND
                EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='require_billing_email_approval' AND tgrelid='erp.notification_outbox'::regclass AND NOT tgisinternal)),
              ('DASHBOARD_FINANCIAL_RPC_PRESENT',
                to_regprocedure('erp.read_dashboard_management_financial_summary(date,date,date,date)') IS NOT NULL AND
                has_function_privilege('authenticated','erp.read_dashboard_management_financial_summary(date,date,date,date)','EXECUTE')),
              ('APPROVAL_COUNT_RPC_PRESENT',
                to_regprocedure('erp.read_pending_management_approvals()') IS NOT NULL AND
                has_function_privilege('authenticated','erp.read_pending_management_approvals()','EXECUTE'))
          )
          SELECT name || '=' || CASE WHEN ok THEN 'PASS' ELSE 'FAIL' END FROM checks;
          SQL
          )"
          printf '%s\n' "$object_checks"
          if grep -q '=FAIL' <<<"$object_checks"; then exit 1; fi
